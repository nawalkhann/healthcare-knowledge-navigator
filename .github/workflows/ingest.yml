name: Ingest sources

# Runs the ingestion job and the retrieval evaluation against the Supabase project.
# Needs repository secrets SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY.
on:
  workflow_dispatch:
    inputs:
      topic:
        description: Only ingest this topic (blank for all)
        required: false
        default: ""
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC, to pick up updated guidance

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ingest
        env:
          TOPIC: ${{ inputs.topic }}
        run: npm run ingest -- ${TOPIC:+--topic "$TOPIC"}
      - name: Evaluate retrieval
        run: npm run eval:retrieval -- --k 5 --min-hit-rate 0.8
