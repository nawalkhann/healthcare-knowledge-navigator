name: Ingest sources

# Runs the ingestion job and the retrieval evaluation against the Supabase project.
# Writes go through the `navigator` Edge Function, which accepts this workflow's OIDC token
# from the main branch, so no database key is stored in GitHub.
on:
  workflow_dispatch:
    inputs:
      topic:
        description: Only ingest this topic (blank for all)
        required: false
        default: ""
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC, to pick up updated guidance

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    env:
      SUPABASE_URL: https://qucujpvvyeslnbkcdryx.supabase.co
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ingest
        env:
          TOPIC: ${{ inputs.topic }}
        run: npm run ingest -- ${TOPIC:+--topic "$TOPIC"}
      - name: Evaluate retrieval
        run: npm run eval:retrieval -- --k 5 --min-hit-rate 0.8
      - name: Check the live site answers a question
        run: |
          curl -sS --fail-with-body -X POST https://healthcare-knowledge-navigator.vercel.app/api/ask \
            -H 'Content-Type: application/json' \
            -d '{"question":"What is the first-line drug treatment for essential hypertension in adults?"}' \
            | tee answer.json
          grep -q '"status":"answered"' answer.json
